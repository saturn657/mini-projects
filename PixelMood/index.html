<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelMood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>PixelMood</h1>
        <p>Choose your mood and change your world.</p>

        <div class="moods">
            <button>😊</button>
            <button>🌊</button>
            <button>⚡</button>
            <button>🌧️</button>
            <button>🌹</button>
        </div>

        <div class="mood-display">
            <span>✨</span>
            <h2>Select a Mood</h2>
            <p>Your vibe will appear here.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
