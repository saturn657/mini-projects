
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelForge | Pixel Art Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="#" class="logo"><span>▦</span> PixelForge</a>
        <span class="status"><span class="status-dot"></span> CREATIVE MODE</span>
    </header>

    <main class="studio">
        <section class="intro">
            <p class="eyebrow">YOUR PIXEL ART PLAYGROUND</p>
            <h1>Small pixels.<br><span>Big imagination.</span></h1>
            <p class="subtitle">Turn a blank canvas into something extraordinary.</p>
        </section>

        <section class="editor">
            <div class="editor-header">
                <div>
                    <span class="live-dot"></span>
                    <strong>Untitled Artwork</strong>
                </div>
                <span class="canvas-label">32 × 32 CANVAS</span>
            </div>

            <div class="canvas-area">
                <div class="pixel-canvas" id="pixelCanvas">
                </div>
            </div>

            <div class="toolbar">
                <span>YOUR COLOURS</span>
                <div class="palette-preview">
                    <span style="background:#ff6584"></span>
                    <span style="background:#ffbd69"></span>
                    <span style="background:#f9f871"></span>
                    <span style="background:#70e1d1"></span>
                    <span style="background:#8b7cff"></span>
                    <span style="background:#ffffff"></span>
                </div>
            </div>
        </section>

        <footer>MADE FOR THE LOVE OF CREATING <span>✦</span></footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
