<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset Escape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="stars"></div>

        <div class="moon"></div>

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>

        <div class="sun"></div>

        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-front"></div>

        <div class="ocean">
            <div class="wave wave-one"></div>
            <div class="wave wave-two"></div>
            <div class="wave wave-three"></div>
        </div>

        <div class="island"></div>

        <div class="palm">
            <div class="trunk"></div>
            <div class="leaf leaf-one"></div>
            <div class="leaf leaf-two"></div>
            <div class="leaf leaf-three"></div>
            <div class="leaf leaf-four"></div>
            <div class="leaf leaf-five"></div>
        </div>

        <div class="caption">
            <h1>Sunset Escape</h1>
            <p>A little peace between the sky and sea.</p>
        </div>
    </div>
</body>
</html>
